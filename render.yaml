# Render Blueprint — AquaOS Coach (natacao-platform)
# Postgres + API Fastify + Web Next.js (plano free)
databases:
  - name: natacao-db
    databaseName: natacao
    user: natacao
    plan: free
    postgresMajorVersion: "16"

services:
  # ─── API Fastify (uploads + ffmpeg) ───────────────────────────
  - type: web
    name: natacao-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build -w @natacao/domain && npm run build -w @natacao/api
    startCommand: npm run start -w @natacao/api
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: API_PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: natacao-db
          property: connectionString
      - key: PERSISTENCE_REQUIRED
        value: "true"
      - key: NODE_ENV
        value: production

  # ─── Frontend Next.js ─────────────────────────────────────────
  - type: web
    name: natacao-web
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build -w @natacao/domain && npm run build -w @natacao/web
    startCommand: npm run start -w @natacao/web
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NODE_ENV
        value: production
