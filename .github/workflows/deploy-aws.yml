name: Deploy AWS Production

on:
  workflow_run:
    workflows: ["Platform CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aquaos-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy validated master to EC2
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_PATH: /opt/natacao
      PUBLIC_URL: https://natacao.elevamkt.digital
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
      AWS_INSTANCE_AZ: ${{ secrets.AWS_INSTANCE_AZ }}
      AWS_INSTANCE_USER: ${{ secrets.AWS_INSTANCE_USER }}
      AWS_INSTANCE_HOST: ${{ secrets.AWS_INSTANCE_HOST }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate EC2 target
        run: |
          set -euo pipefail
          for name in AWS_REGION AWS_INSTANCE_ID AWS_INSTANCE_AZ AWS_INSTANCE_USER AWS_INSTANCE_HOST; do
            if [ -z "${!name:-}" ]; then
              echo "$name is not configured in GitHub Actions secrets." >&2
              exit 1
            fi
          done

          state="$(aws ec2 describe-instances \
            --instance-ids "$AWS_INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)"
          if [ "$state" != "running" ]; then
            echo "EC2 target is not running (state=$state)." >&2
            exit 1
          fi

          current_host="$(aws ec2 describe-instances \
            --instance-ids "$AWS_INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)"
          if [ -n "$current_host" ] && [ "$current_host" != "None" ] && [ "$current_host" != "$AWS_INSTANCE_HOST" ]; then
            echo "Configured host does not match the EC2 public address." >&2
            exit 1
          fi

      - name: Authorize ephemeral SSH key with EC2 Instance Connect
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/aquaos-deploy
          chmod 600 ~/.ssh/aquaos-deploy

          aws ec2-instance-connect send-ssh-public-key \
            --region "$AWS_REGION" \
            --availability-zone "$AWS_INSTANCE_AZ" \
            --instance-id "$AWS_INSTANCE_ID" \
            --instance-os-user "$AWS_INSTANCE_USER" \
            --ssh-public-key "file://$HOME/.ssh/aquaos-deploy.pub" \
            --query Success \
            --output text | grep -qx True

          # EC2 Instance Connect keys are short-lived, so establish trust and connect immediately.
          ssh-keyscan -T 10 -H "$AWS_INSTANCE_HOST" >> ~/.ssh/known_hosts

      - name: Sync master, rebuild and restart
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/aquaos-deploy "$AWS_INSTANCE_USER@$AWS_INSTANCE_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/natacao

          git fetch --prune origin master
          git checkout master
          git reset --hard origin/master

          test -s .env || { echo "Production .env is missing" >&2; exit 1; }
          docker compose -f docker-compose.aws.yml config >/dev/null

          # Build serially on the t3.small to reduce peak memory pressure.
          export COMPOSE_PARALLEL_LIMIT=1
          docker compose -f docker-compose.aws.yml build api web

          # The RKF document is private and must already exist in the persistent volume.
          docker compose -f docker-compose.aws.yml run --rm --no-deps --entrypoint sh api -c \
            'test -s /data/storage/knowledge/rkf-base.docx || { echo "Missing /data/storage/knowledge/rkf-base.docx" >&2; exit 1; }'

          docker compose -f docker-compose.aws.yml up -d --remove-orphans

          # The API does not publish port 4000 on the host; validate from inside the container.
          for attempt in $(seq 1 30); do
            if docker compose -f docker-compose.aws.yml exec -T api node -e \
              "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose -f docker-compose.aws.yml ps
              docker compose -f docker-compose.aws.yml logs --tail=120 api
              exit 1
            fi
            sleep 2
          done

          # Authenticated runtime validation using credentials already present in the server .env.
          # No password is printed or sent back to GitHub logs.
          docker compose -f docker-compose.aws.yml exec -T api node --input-type=module <<'NODE'
          const base = 'http://127.0.0.1:4000';
          const email = process.env.AUTH_COACH_EMAIL;
          const password = process.env.AUTH_COACH_PASSWORD;
          if (!email || !password) throw new Error('Production coach credentials are not configured in the API environment');

          const login = await fetch(`${base}/api/v1/auth/login`, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ email, password }),
          });
          if (!login.ok) throw new Error(`Runtime login failed (${login.status})`);
          const cookie = login.headers.get('set-cookie')?.split(';')[0];
          if (!cookie) throw new Error('Runtime login did not return a session cookie');

          const knowledgeResponse = await fetch(`${base}/api/v1/ai/knowledge-status`, { headers: { cookie } });
          if (!knowledgeResponse.ok) throw new Error(`Knowledge status failed (${knowledgeResponse.status})`);
          const knowledge = await knowledgeResponse.json();
          if (knowledge.combinedReady !== true) throw new Error(`RKF combined context is not ready: ${JSON.stringify(knowledge)}`);

          const aiResponse = await fetch(`${base}/api/v1/ai/status`, { headers: { cookie } });
          if (!aiResponse.ok) throw new Error(`AI status failed (${aiResponse.status})`);
          const ai = await aiResponse.json();
          if (ai.available !== true) throw new Error(`Configured LLM is unavailable: ${ai.reason ?? 'unknown reason'}`);

          console.log(`runtime validation ok · knowledge+catalog=${knowledge.combinedReady} · ai=${ai.available}`);
          NODE
          REMOTE

      - name: Validate public production endpoints
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --max-time 30 "$PUBLIC_URL/api/v1/health")"
          HEALTH_BODY="$body" node -e 'const h=JSON.parse(process.env.HEALTH_BODY); if(h.ok!==true || h.mode!=="production") process.exit(1); console.log(`public api ok · mode=${h.mode}`)'
          curl --fail --silent --show-error --max-time 30 --output /dev/null "$PUBLIC_URL/"
          curl --fail --silent --show-error --max-time 30 --output /dev/null "$PUBLIC_URL/manifest.webmanifest"

      - name: Remove ephemeral SSH key from runner
        if: always()
        run: rm -f ~/.ssh/aquaos-deploy ~/.ssh/aquaos-deploy.pub
