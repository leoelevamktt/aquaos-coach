name: Production Public Health

on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check API health
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --max-time 30 https://natacao.elevamkt.digital/api/v1/health)"
          HEALTH_BODY="$body" node -e 'const h=JSON.parse(process.env.HEALTH_BODY); if(h.ok!==true) process.exit(1); console.log(`api ok · service=${h.service ?? "unknown"} · mode=${h.mode ?? "unknown"}`)'

      - name: Check public web
        run: curl --fail --silent --show-error --max-time 30 --output /dev/null https://natacao.elevamkt.digital/

      - name: Check PWA manifest
        run: curl --fail --silent --show-error --max-time 30 --output /dev/null https://natacao.elevamkt.digital/manifest.webmanifest
